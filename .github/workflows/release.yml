name: Release

# Push a tag like v0.4.0 to build the Windows installer and attach it to a
# draft GitHub Release. Review the draft, then publish it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: VIBDL ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what changed. The installer is not code-signed, so Windows SmartScreen may warn you.
          releaseDraft: true
          prerelease: false
