name: Feature request
description: Suggest an idea or a new board.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
  - type: input
    id: terms
    attributes:
      label: For a new board, a link to its API terms
